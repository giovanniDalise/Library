<div class="container py-5">
  <a routerLink="/books" class="home-btn mb-4">
    <i class="bi bi-journal-bookmark"></i> Books
  </a>

  <div class="row justify-content-center">
    <div class="col-12 col-xl-10 col-xxl-9">
      <div class="card shadow rounded p-4" style="min-width: 400px;">

        <h2 class="text-center text-light mb-4">{{ pageTitle }}</h2>

        <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-4">

          <!-- TITLE -->
          <div class="input-group">
            <span class="input-group-text">Title</span>
            <input type="text" class="form-control" formControlName="title" placeholder="Book title"/>
          </div>

          <!-- ISBN -->
          <div class="input-group">
            <span class="input-group-text">ISBN</span>
            <input type="text" class="form-control" formControlName="isbn" placeholder="ISBN code"/>
          </div>

          <!-- EDITOR -->
          <div class="input-group">
            <span class="input-group-text">Editor</span>
            <select class="form-select" formControlName="editorId">
              <option [ngValue]="null" disabled>Select an editor</option>
              <option *ngFor="let editor of availableEditors" [ngValue]="editor.id">
                {{ editor.name }}
              </option>
            </select>
          </div>

          <!-- AUTHORS -->
          <div class="d-flex flex-column gap-3">
            <h5 class="text-start text-light">Authors</h5>

            <!-- Selezione autore -->
            <div class="input-group">
              <select class="form-select" [(ngModel)]="selectedAuthorId" [ngModelOptions]="{standalone: true}">
                <option [ngValue]="null" disabled>Select an author</option>
                <option *ngFor="let author of availableAuthors" [ngValue]="author.id">
                  {{ author.name }} {{ author.surname }}
                </option>
              </select>
              <button type="button" class="btn btn-action-outline" (click)="addSelectedAuthor()">
                <i class="bi bi-plus-lg"></i> Add
              </button>
            </div>

            <!-- Autori selezionati -->
            <div *ngIf="selectedAuthors.length > 0" class="d-flex flex-column gap-2">
              <div *ngFor="let author of selectedAuthors"
                   class="d-flex justify-content-between align-items-center border rounded p-2">
                <span class="text-light">{{ author.name }} {{ author.surname }}</span>
                <button type="button" class="btn btn-sm btn-edit" (click)="removeAuthor(author.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <small *ngIf="selectedAuthors.length === 0" class="text-light">
              At least one author is required.
            </small>
          </div>

          <!-- COVER -->
          <div class="d-flex flex-column gap-2">
            <div class="input-group">
              <span class="input-group-text">Cover</span>
              <input type="file" id="coverFile" class="d-none" (change)="onCoverSelected($event)" accept="image/*"/>
              <label for="coverFile" class="form-control" style="cursor: pointer; margin-bottom: 0;">
                {{ coverFile?.name || 'Choose file' }}
              </label>
            </div>

            <div *ngIf="existingCoverReference" class="d-flex flex-column align-items-center gap-2 mt-2">
              <img [src]="existingCoverReference" alt="Cover preview" class="book-cover rounded shadow-sm"/>
              <button type="button" class="btn btn-action-outline btn-sm" (click)="removeCover()">
                <i class="bi bi-trash"></i> Remove cover
              </button>
            </div>

            <small *ngIf="!existingCoverReference && !coverFile" class="text-light">
              No cover — leave empty or upload one.
            </small>
          </div>

          <!-- SUBMIT -->
          <button type="submit" class="btn btn-action-outline w-100"
                  [disabled]="bookForm.invalid || selectedAuthors.length === 0">
            <i class="bi bi-check-circle"></i> {{ submitLabel }}
          </button>

        </form>
      </div>
    </div>
  </div>
</div>
