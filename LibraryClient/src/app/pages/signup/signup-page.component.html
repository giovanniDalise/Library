<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-11 col-xl-10">
      <a routerLink="/home" class="home-btn mb-3">
        <i class="bi-house-door"></i> Home Page
      </a>

      <div class="card shadow rounded p-4">

        <h2 class="text-center text-light mb-4">
          Sign up
        </h2>

        <form (ngSubmit)="register()" class="d-flex flex-column gap-3">

          <!-- NAME -->
          <div class="input-group">
            <span class="input-group-text">Name</span>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="name"
              name="name"
              required>
          </div>

          <!-- SURNAME -->
          <div class="input-group">
            <span class="input-group-text">Surname</span>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="surname"
              name="surname"
              required>
          </div>

          <!-- EMAIL -->
          <div class="input-group">
            <span class="input-group-text">Email</span>
            <input
              type="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              required>
          </div>

          <!-- PASSWORD -->
          <div class="input-group">
            <span class="input-group-text">Password</span>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="password"
              name="password"
              required>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="input-group">
            <span class="input-group-text">Confirm Password</span>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required>
          </div>

          <button
            type="submit"
            class="btn btn-action-outline w-100 mt-2">
            <i class="bi bi-person-plus"></i>
            Sign up
          </button>

          <div class="text-center mt-2">
            <a routerLink="/login" class="text-light">
              Already registered? Log in
            </a>
          </div>

        </form>

      </div>

    </div>
  </div>

</div>
