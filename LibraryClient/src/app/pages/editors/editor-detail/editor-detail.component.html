<div class="container py-5">

  <a class="home-btn mb-4" (click)="onBack()">
    <i class="bi bi-building"></i> Editors           
  </a>

  <div *ngIf="isLoading" class="text-center text-light mt-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-4">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && editor" class="row justify-content-center">
    <div class="col-12 col-xl-10 col-xxl-9">

      <!-- Card dettaglio editor -->
      <div class="card shadow rounded p-4 mb-4">
        <div class="d-flex justify-content-between align-items-start">
          <h2 class="text-light mb-0">{{ editor.name }}</h2>
          <div class="d-flex gap-2 ms-3 flex-shrink-0" *ngIf="isAdmin">
            <button class="btn btn-action-outline" (click)="onEdit()">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn btn-action-outline" (click)="onDelete()">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>

      <!-- Card libri associati con paginazione -->
      <div class="card shadow rounded p-4">
        <h5 class="text-light mb-3">
          <i class="bi bi-book"></i> Books
        </h5>

        <ul *ngIf="editor.books.items.length > 0; else noBooks" class="book-list">
          <li *ngFor="let title of editor.books.items" class="book-list-item">
            <i class="bi bi-bookmark"></i> {{ title }}
          </li>
        </ul>

        <app-pagination
          [currentPage]="pagination.currentPage"
          [totalPages]="pagination.totalPages"
          [totalRecords]="pagination.totalRecords"
          (next)="nextPage()"
          (prev)="prevPage()">
        </app-pagination>

        <ng-template #noBooks>
          <p class="text-light">No books associated with this editor.</p>
        </ng-template>
      </div>

    </div>
  </div>
</div>
