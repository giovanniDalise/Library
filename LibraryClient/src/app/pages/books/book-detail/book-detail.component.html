<div class="container py-5">

  <a class="home-btn mb-4" (click)="onBack()">
    <i class="bi bi-journal-bookmark"></i> Books
  </a>

  <div *ngIf="isLoading" class="text-center text-light mt-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-4">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && book" class="d-flex justify-content-center w-100">
    <div class="detail-card-wrapper">
      <div class="card shadow rounded p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="text-light mb-0">{{ book.title }}</h2>
          <div class="d-flex gap-2 ms-3 flex-shrink-0" *ngIf="isAdmin">
            <button class="btn btn-action-outline" (click)="onEdit()">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn btn-action-outline" (click)="onDelete()">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>

        <div class="d-flex gap-4 align-items-center">
          <!-- Copertina -->
          <div class="flex-shrink-0">
            <img
              *ngIf="book.coverReference; else noCover"
              [src]="book.coverReference"
              alt="Cover of {{ book.title }}"
              class="book-cover rounded shadow"
            />
            <ng-template #noCover>
              <div class="book-cover-placeholder rounded shadow d-flex align-items-center justify-content-center">
                <i class="bi bi-image text-secondary fs-1"></i>
              </div>
            </ng-template>
          </div>

          <!-- Info libro -->
          <div class="flex-grow-1">
            <dl class="book-info-list">
              <div class="book-info-item">
                <dt><i class="bi bi-upc-scan me-2"></i>ISBN</dt>
                <dd>{{ book.isbn || '—' }}</dd>
              </div>
              <div class="book-info-item">
                <dt><i class="bi bi-person me-2"></i>Author</dt>
                <dd *ngFor="let author of book.authors">
                  {{ author.name }} {{ author.surname }}
                </dd>
              </div>
              <div class="book-info-item">
                <dt><i class="bi bi-building me-2"></i>Editor</dt>
                <dd>{{ book.editor.name }}</dd>
              </div>
            </dl>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
