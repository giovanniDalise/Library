<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-11 col-xl-10">
      <!-- Bottoni navigazione affiancati -->
        <div class="d-flex justify-content-center gap-3 mb-3">
            <a routerLink="/home" class="home-btn">
                <i class="bi bi-house-door"></i> Home Page
            </a>
            <a routerLink="/login" class="home-btn">
                <i class="bi bi-send"></i>Login
            </a>
        </div>
        <div class="card shadow rounded p-4">

        <h2 class="text-center text-light mb-4">
          Forgot Password
        </h2>
        <p class="text-center text-light mb-4 fs-5 form-description">
          Enter your email address and we will send you a link to reset your password.
        </p>
        <div class="input-group">
          <span class="input-group-text">Email</span>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required>
        </div>

        <button
          type="button"
          class="btn btn-action-outline w-100 mt-3"
          (click)="sendResetLink()">
          <i class="bi bi-envelope"></i>
          Send Reset Link
        </button>

      </div>

    </div>
  </div>

</div>
