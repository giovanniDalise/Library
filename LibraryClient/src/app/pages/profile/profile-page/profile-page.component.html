<div class="container py-5">
  <h1 class="main-title">Profile</h1>

  <div *ngIf="isLoading" class="text-center text-light mt-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-4">{{ errorMessage }}</div>

  <div *ngIf="user" class="d-flex justify-content-center w-100">
    <div class="detail-card-wrapper">
      <div class="card shadow rounded p-4">

        <div class="text-center mb-4">
          <img *ngIf="user.profileImageUrl; else noPhoto"
               [src]="user.profileImageUrl"
               alt="Profile photo"
               class="rounded-circle"
               style="width: 140px; height: 140px; object-fit: cover;">
          <ng-template #noPhoto>
            <i class="bi bi-person-circle text-light" style="font-size: 140px;"></i>
          </ng-template>

          <div class="mt-3">
            <label class="btn btn-action-outline mb-0" [class.disabled]="isUploading">
              <i class="bi bi-camera"></i> {{ isUploading ? 'Uploading...' : 'Change photo' }}
              <input type="file" hidden accept="image/jpeg,image/png,image/webp"
                     [disabled]="isUploading" (change)="onPhotoSelected($event)">
            </label>
          </div>
        </div>

        <h2 class="text-light text-center mb-4">{{ user.name }} {{ user.surname }}</h2>

        <ul class="list-unstyled text-light text-start mb-0">
          <li><strong>Email:</strong> {{ user.email }}</li>
          <li><strong>Role:</strong> {{ role }}</li>
          <li><strong>Phone:</strong> {{ user.phoneNumber || 'Not set' }}</li>
          <li><strong>Member since:</strong> {{ user.createdAt | date:'longDate' }}</li>
        </ul>

      </div>
    </div>
  </div>
</div>
