<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-11 col-xl-10">

      <div class="d-flex gap-3 mb-3">
        <a routerLink="/home" class="home-btn">
          <i class="bi bi-house-door"></i> Home Page
        </a>
        <a routerLink="/login" class="home-btn">
          <i class="bi bi-send"></i>Login
        </a>
      </div>

      <div class="card shadow rounded p-4">

        <h2 class="text-center text-light mb-3">Reset Password</h2>

        <p class="text-center text-light mb-4 fs-5">
          Enter your new password below.
        </p>

        <div class="d-flex flex-column gap-3">

          <!-- NUOVA PASSWORD -->
          <div class="input-group">
            <span class="input-group-text">New Password</span>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="newPassword"
              name="newPassword"
              required>
          </div>

          <!-- CONFERMA NUOVA PASSWORD -->
          <div class="input-group">
            <span class="input-group-text">Confirm Password</span>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required>
          </div>

          <button
            type="button"
            class="btn btn-action-outline w-100 mt-3"
            (click)="resetPassword()">
            <i class="bi bi-lock"></i>
            Reset Password
          </button>

        </div>

      </div>

    </div>
  </div>

</div>
