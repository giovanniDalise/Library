services:
  # ============================================================
  # MYSQL - un container per ogni microservizio
  # ============================================================

  mysql-books:
    image: giovannidalise/librarymknwdot-mysql-books:latest
    build:
      context: ./MySQLServiceBooks
      dockerfile: Dockerfile
    container_name: mysql-books
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-books-data:/var/lib/mysql
    networks:
      - library_default
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-identity:
    image: giovannidalise/librarymknwdot-mysql-identity:latest
    build:
      context: ./MySQLServiceIdentity
      dockerfile: Dockerfile
    container_name: mysql-identity
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library_identity
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-identity-data:/var/lib/mysql
    networks:
      - library_default
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-reservation:
    image: giovannidalise/librarymknwdot-mysql-reservation:latest
    build:
      context: ./MySQLServiceReservation
      dockerfile: Dockerfile
    container_name: mysql-reservation
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: library_reservation
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-reservation-data:/var/lib/mysql
    networks:
      - library_default
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # RABBITMQ
  # ============================================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - library_default
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # SERVIZI APPLICATIVI
  # ============================================================

  bookservice:
    image: giovannidalise/librarymknwdot-bookservice:latest
    build:
      context: ./BookService
      dockerfile: Dockerfile
    container_name: bookservice-container
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__BookDbConnection: "Server=mysql-books;Port=3306;Database=library;Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};"
      Media__BasePath: /app/images
      Media__BaseUrl: http://localhost:5282
    ports:
      - "5282:5282"
    depends_on:
      mysql-books:
        condition: service_healthy
    volumes:
      - book-images:/app/images
      - logs-data:/app/logs
    networks:
      - library_default
    restart: always

  identityservice:
    image: giovannidalise/librarymknwdot-identityservice:latest
    build:
      context: ./IdentityService
      dockerfile: Dockerfile
    container_name: identityservice-container
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__IdentityServiceDbConnection: "Server=mysql-identity;Port=3306;Database=library_identity;Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5022:5022"
    depends_on:
      mysql-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - logs-data:/app/logs
    networks:
      - library_default
    restart: always

  emailservice:
    image: giovannidalise/librarymknwdot-emailservice:latest
    build:
      context: ./EMailService
      dockerfile: Dockerfile
    container_name: emailservice-container
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Email__Host: ${MAIL_HOST}
      Email__Port: ${MAIL_PORT}
      Email__Username: ${MAIL_USERNAME}
      Email__Password: ${MAIL_PASSWORD}
      Email__FromAddress: ${MAIL_FROM}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - logs-data:/app/logs
    networks:
      - library_default
    restart: always

  libraryclient:
    image: giovannidalise/librarymknwdot-libraryclient:latest
    build:
      context: ./LibraryClient
      dockerfile: Dockerfile
    container_name: libraryclient-container
    ports:
      - "4200:80"
    depends_on:
      - bookservice
    networks:
      - library_default
    restart: always

  images-init:
    image: giovannidalise/librarymknwdot-images-init:latest
    build:
      context: ./LibraryImages
      dockerfile: Dockerfile
    volumes:
      - book-images:/app/images

  api-gateway:
    build:
      context: ./ApiGateway
    container_name: api-gateway
    ports:
      - "8080:80"
    depends_on:
      - bookservice
      - identityservice
    networks:
      - library_default

networks:
  library_default:
    driver: bridge

volumes:
  mysql-books-data: {}
  mysql-identity-data: {}
  mysql-reservation-data: {}
  book-images: {}
  logs-data: {}
  rabbitmq-data: {}