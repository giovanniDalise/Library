<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px;">
        <h2 style="color: #333;">Hi, {{FullName}}!</h2>
        <p>We received a request to reset your password. Click the button below to proceed.</p>
        <p>The link will expire on <strong>{{ExpiresAt}}</strong>.</p>
        <a href="{{ResetUrl}}"
            style="display: inline-block; padding: 12px 24px; background-color: #555;
                    color: white; text-decoration: none; border-radius: 6px; margin-top: 16px;">
            Reset Password
        </a>
        <p style="margin-top: 24px; color: #999; font-size: 12px;">
            If you did not request a password reset, ignore this email.
        </p>
    </div>
</body>
</html>
